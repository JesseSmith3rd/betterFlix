<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BetterFlix</title>

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:#12121a;
      --panel2:#171723;
      --text:#f3f4f6;
      --muted:#a1a1aa;
      --border:rgba(255,255,255,.08);
      --shadow:0 10px 30px rgba(0,0,0,.45);
      --radius:16px;
      --radius2:14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,0,80,.10), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(0,160,255,.10), transparent 55%),
                  var(--bg);
      color:var(--text);
    }

    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,11,15,.70);
      border-bottom:1px solid var(--border);
    }

    .wrap{max-width:1200px; margin:0 auto; padding:16px;}
    .topbar{
      display:flex; align-items:center; gap:14px;
    }
    .brand{
      display:flex; align-items:center; gap:10px; min-width:150px;
      font-weight:800; letter-spacing:.3px;
    }
    .dot{
      width:12px; height:12px; border-radius:999px;
      background: #ff1b6b;
      box-shadow: 0 0 0 4px rgba(255,27,107,.15);
    }
    .search{
      flex:1;
      display:flex; align-items:center; gap:10px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--border);
      border-radius:999px;
      padding:10px 14px;
    }
    .search input{
      width:100%;
      background:transparent; border:none; outline:none;
      color:var(--text);
      font-size:14px;
    }
    .search input::placeholder{color:rgba(255,255,255,.45)}
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.04);
      white-space:nowrap;
    }

    main{padding:16px;}
    .grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:16px;
      align-items:start;
      max-width:1200px;
      margin:0 auto;
      padding:0 16px 24px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .playerHead{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 14px 10px;
      border-bottom:1px solid var(--border);
      background: rgba(255,255,255,.03);
    }

    .playerTitle{
      font-weight:700;
      font-size:14px;
      color:rgba(255,255,255,.9);
    }

    video{
      width:100%;
      max-height:68vh;
      background:#000;
      display:block;
    }

    .now{
      padding:12px 14px;
      color: var(--muted);
      font-size:13px;
      border-top:1px solid var(--border);
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }

    .libraryHead{
      display:flex; align-items:flex-end; justify-content:space-between;
      padding:14px;
      border-bottom:1px solid var(--border);
      background: rgba(255,255,255,.03);
      gap:12px;
    }
    .libraryHead h2{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
    }
    .status{
      font-size:12px;
      color:var(--muted);
    }

    .tiles{
      padding:14px;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap:12px;
      max-height:72vh;
      overflow:auto;
    }

    .tile{
      position:relative;
      border-radius: var(--radius2);
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      padding:12px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      outline:none;
    }
    .tile:hover{ transform: translateY(-2px); border-color: rgba(255,255,255,.16); }
    .tile:focus-visible{
      border-color: rgba(255,27,107,.75);
      box-shadow: 0 0 0 4px rgba(255,27,107,.20);
    }

    .tileTitle{
      font-weight:700;
      font-size:13px;
      margin:0 0 6px;
      line-height:1.2;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .tileMeta{
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      position:absolute;
      top:10px;
      right:10px;
      font-size:10px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.85);
      display:none;
    }
    .tile.active{
      border-color: rgba(255,27,107,.55);
      background: linear-gradient(180deg, rgba(255,27,107,.14), rgba(255,255,255,.02));
    }
    .tile.active .badge{ display:inline-block; }

    /* Mobile layout */
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      video{ max-height: 45vh; }
      .tiles{ max-height: unset; }
    }

    .poster {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}
.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <span class="dot"></span>
          <span>BetterFlix</span>
        </div>

        <div class="search" role="search">
          <input id="q" type="search" placeholder="Search your library…" autocomplete="off" />
        </div>

        <div class="pill" id="countPill">0 titles</div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid">
      <!-- Player -->
      <section class="card">
        <div class="playerHead">
          <div class="playerTitle">Player</div>
          <div class="pill" id="hintPill">Enter = Play • Arrows = Move</div>
        </div>

        <video id="player" controls playsinline></video>

        <div class="now">
          <div id="now">Pick a title to start playing.</div>
          <div id="path" class="status"></div>
        </div>
      </section>

      <!-- Library -->
      <section class="card">
        <div class="libraryHead">
          <div>
            <h2>Library</h2>
            <div class="status" id="status">Loading…</div>
          </div>
          <div class="pill" id="focusPill">Focus: 0</div>
        </div>

        <div class="tiles" id="tiles" role="listbox" aria-label="Movie library"></div>
      </section>
    </div>
  </main>

  <script>
    // ✅ Works on PC + phone + LAN URLs (no hardcoded localhost)
    const API = location.origin;

    const els = {
      q: document.getElementById("q"),
      tiles: document.getElementById("tiles"),
      status: document.getElementById("status"),
      countPill: document.getElementById("countPill"),
      focusPill: document.getElementById("focusPill"),
      now: document.getElementById("now"),
      path: document.getElementById("path"),
      player: document.getElementById("player"),
    };

    let all = [];
    let filtered = [];
    let focusIndex = 0;
    let currentId = null;

    function setStatus(text){ els.status.textContent = text; }
    function setFocusPill(){ els.focusPill.textContent = `Focus: ${filtered.length ? focusIndex+1 : 0}`; }

    async function load(){
      setStatus("Loading…");
      const res = await fetch(`${API}/api/movies`);
      const data = await res.json();

      if (data.error) {
        setStatus(`Error: ${data.error}`);
        els.path.textContent = data.moviesDir ? `Path: ${data.moviesDir}` : "";
        return;
      }

      all = data.items || [];
      filtered = [...all];
      els.countPill.textContent = `${filtered.length} title${filtered.length===1?"":"s"}`;
      setStatus(`Loaded ${filtered.length} title${filtered.length===1?"":"s"}`);
      els.path.textContent = data.moviesDir ? `Path: ${data.moviesDir}` : "";
      render();
      focusIndex = 0;
      setFocusPill();
      focusTile(focusIndex);
    }

    function render(){
      els.tiles.innerHTML = "";
      filtered.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile" + (item.id === currentId ? " active" : "");
        btn.setAttribute("role", "option");
        btn.dataset.index = idx;
        btn.innerHTML = `
          <span class="badge">Playing</span>
          <div class="tileTitle">${escapeHtml(item.title)}</div>
          <div class="tileMeta">${escapeHtml(item.file)}</div>
        `;
        
        btn.innerHTML = `
  <span class="badge">Playing</span>

  <div class="poster">
    <img
      src="${item.posterUrl || ""}"
      alt=""
      loading="lazy"
      onerror="this.remove();"
    />
  </div>

  <div class="tileTitle">${escapeHtml(item.title)}</div>
  <div class="tileMeta">${escapeHtml(item.file)}</div>
`;
console.log("POSTER URL:", item.posterUrl);

        btn.addEventListener("click", () => {
          focusIndex = idx;
          setFocusPill();
          play(item);
          focusTile(idx);
        });

        btn.addEventListener("focus", () => {
          focusIndex = idx;
          setFocusPill();
        });

        els.tiles.appendChild(btn);
      });

      els.countPill.textContent = `${filtered.length} title${filtered.length===1?"":"s"}`;
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function play(item){
      currentId = item.id;
      els.now.textContent = `Now playing: ${item.title}`;
      els.player.src = `${API}/api/stream/${encodeURIComponent(item.file)}`;
      els.player.play().catch(()=>{});
      markActive();
    }

    function markActive(){
      [...els.tiles.children].forEach((el) => {
        el.classList.toggle("active", el.querySelector(".tileMeta")?.textContent === currentFileText());
      });
      // More robust: compare dataset id
      [...els.tiles.children].forEach((el) => {
        const idx = Number(el.dataset.index);
        el.classList.toggle("active", filtered[idx]?.id === currentId);
      });
    }

    function currentFileText(){
      // helper for older browsers; not relied upon
      return "";
    }

    function applyFilter(){
      const q = els.q.value.trim().toLowerCase();
      filtered = q
        ? all.filter(x => (x.title || "").toLowerCase().includes(q) || (x.file || "").toLowerCase().includes(q))
        : [...all];

      focusIndex = 0;
      render();
      setStatus(`Showing ${filtered.length} title${filtered.length===1?"":"s"}`);
      setFocusPill();
      focusTile(0);
    }

    function focusTile(i){
      const tiles = els.tiles.children;
      if (!tiles.length) return;
      const clamped = Math.max(0, Math.min(i, tiles.length - 1));
      focusIndex = clamped;
      tiles[clamped].focus({ preventScroll: false });
      tiles[clamped].scrollIntoView({ block: "nearest", inline: "nearest" });
      setFocusPill();
    }

    function moveFocus(delta){
      if (!filtered.length) return;
      focusTile(focusIndex + delta);
    }

    // Keyboard navigation: arrows + enter
    document.addEventListener("keydown", (e) => {
      // Ignore when typing in search
      if (document.activeElement === els.q) {
        if (e.key === "ArrowDown") { e.preventDefault(); focusTile(0); }
        return;
      }

      const cols = getGridCols();
      if (e.key === "ArrowRight") { e.preventDefault(); moveFocus(1); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); moveFocus(-1); }
      if (e.key === "ArrowDown")  { e.preventDefault(); moveFocus(cols); }
      if (e.key === "ArrowUp")    { e.preventDefault(); moveFocus(-cols); }
      if (e.key === "Enter") {
        e.preventDefault();
        const item = filtered[focusIndex];
        if (item) play(item);
      }
    });

    function getGridCols(){
      // Estimate columns based on container width
      const width = els.tiles.clientWidth;
      const cardMin = 180;
      const gap = 12;
      const cols = Math.max(1, Math.floor((width + gap) / (cardMin + gap)));
      return cols;
    }

    els.q.addEventListener("input", applyFilter);

    load();
  </script>
</body>

</html>
